<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" font-family="Pretendard, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6BA3E6"/></marker></defs>
<rect width="1280" height="720" fill="#11161F"/>
<text x="56" y="62" font-size="31" font-weight="800" fill="#EAF0F7">보안 그룹 vs 네트워크 ACL</text>
<text x="56" y="92" font-size="17" fill="#93A2B3">Stateful·인스턴스·허용만(SG)  ↔  Stateless·서브넷·허용+거부(NACL) — 시험 최대 단골</text>
<rect x="70" y="150" width="540" height="420" rx="16" fill="#1B2432" stroke="#2f8f6a"/><image x="104.0" y="184.0" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="180" y="200" font-size="20" fill="#2f8f6a" font-weight="700" text-anchor="start">보안 그룹 (SG)</text><text x="180" y="226" font-size="12" fill="#93A2B3" text-anchor="start"></text><text x="98" y="280" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">적용 대상</text><text x="240" y="280" font-size="14" fill="#EAF0F7" text-anchor="start">인스턴스(ENI) 단위</text><text x="98" y="326" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">상태</text><text x="240" y="326" font-size="14" fill="#EAF0F7" text-anchor="start">Stateful — 응답 자동 허용</text><text x="98" y="372" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">규칙</text><text x="240" y="372" font-size="14" fill="#EAF0F7" text-anchor="start">허용(Allow)만</text><text x="98" y="418" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">평가</text><text x="240" y="418" font-size="14" fill="#EAF0F7" text-anchor="start">모든 규칙 함께</text><text x="98" y="464" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">용도</text><text x="240" y="464" font-size="14" fill="#EAF0F7" text-anchor="start">이 서버가 받을 트래픽</text><rect x="670" y="150" width="540" height="420" rx="16" fill="#1B2432" stroke="#6BA3E6"/><image x="704.0" y="184.0" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="780" y="200" font-size="20" fill="#6BA3E6" font-weight="700" text-anchor="start">네트워크 ACL</text><text x="780" y="226" font-size="12" fill="#93A2B3" text-anchor="start"></text><text x="698" y="280" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">적용 대상</text><text x="840" y="280" font-size="14" fill="#EAF0F7" text-anchor="start">서브넷 단위</text><text x="698" y="326" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">상태</text><text x="840" y="326" font-size="14" fill="#EAF0F7" text-anchor="start">Stateless — 인·아웃 각각</text><text x="698" y="372" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">규칙</text><text x="840" y="372" font-size="14" fill="#EAF0F7" text-anchor="start">허용 + 거부(Deny)</text><text x="698" y="418" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">평가</text><text x="840" y="418" font-size="14" fill="#EAF0F7" text-anchor="start">번호 순, 먼저 맞는 규칙</text><text x="698" y="464" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">용도</text><text x="840" y="464" font-size="14" fill="#EAF0F7" text-anchor="start">특정 IP 광역 차단</text><text x="70" y="610" font-size="15" fill="#93A2B3" text-anchor="start">요청은 &#x27;서브넷 경계의 NACL → 인스턴스의 SG&#x27; 순서로 통과한다. 둘 다 통과해야 도달.</text>
<text x="56" y="696" font-size="12" fill="#93A2B3">SecureNomad  ·  AWS SAA-C03</text>
</svg>