<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" font-family="Pretendard, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6BA3E6"/></marker></defs>
<rect width="1280" height="720" fill="#11161F"/>
<text x="56" y="62" font-size="31" font-weight="800" fill="#EAF0F7">데이터 보호 — 봉투 암호화(Envelope Encryption)</text>
<text x="56" y="92" font-size="17" fill="#93A2B3">KMS의 핵심: 데이터는 데이터 키로, 데이터 키는 마스터 키(CMK)로</text>
<image x="121.0" y="301.0" width="58" height="58" href="data:image/svg+xml;base64,"/><text x="150.0" y="380.0" text-anchor="middle" font-size="14" font-weight="700" fill="#EAF0F7">평문 데이터</text><rect x="300" y="290" width="230" height="90" rx="12" fill="#1B2432" stroke="#3b7fd4"/><text x="415" y="330" font-size="15" fill="#EAF0F7" font-weight="700" text-anchor="middle">데이터 키(DEK)로</text><text x="415" y="356" font-size="14" fill="#93A2B3" text-anchor="middle">데이터 암호화</text><line x1="210" y1="330" x2="296" y2="330" stroke="#6BA3E6" stroke-width="2.4" marker-end="url(#ah)"/><rect x="600" y="170" width="560" height="400" rx="14" fill="none" stroke="#ED7100" stroke-dasharray="4 5" opacity="1.0"/><image x="616" y="182" width="24" height="24" href="data:image/svg+xml;base64,"/><text x="648" y="199" font-size="13" font-weight="700" fill="#ED7100">KMS 경계 — 마스터 키(CMK)는 절대 밖으로 안 나감</text><image x="725.0" y="255.0" width="70" height="70" href="data:image/svg+xml;base64,"/><text x="760.0" y="346.0" text-anchor="middle" font-size="14" font-weight="700" fill="#EAF0F7">KMS CMK</text><rect x="930" y="255" width="200" height="80" rx="12" fill="#212C3C" stroke="#ED7100"/><text x="1030" y="290" font-size="14" fill="#EAF0F7" font-weight="700" text-anchor="middle">CMK로 데이터 키를</text><text x="1030" y="314" font-size="13" fill="#93A2B3" text-anchor="middle">다시 암호화</text><line x1="540" y1="335" x2="690" y2="310" stroke="#6BA3E6" stroke-width="2.4" marker-end="url(#ah)"/><text x="615" y="300" font-size="12" fill="#93A2B3" text-anchor="middle">데이터 키 전달</text><rect x="600" y="440" width="560" height="100" rx="12" fill="#1B2432" stroke="#3C3324"/><text x="630" y="478" font-size="14" fill="#6BA3E6" font-weight="700" text-anchor="start">저장</text><text x="630" y="512" font-size="14" fill="#EAF0F7" text-anchor="start">암호화된 데이터  +  암호화된 데이터 키  를 함께 저장 — 복호화 때만 KMS에 &#x27;풀어 달라&#x27; 요청</text><text x="70" y="660" font-size="13" fill="#93A2B3" text-anchor="start">큰 데이터를 KMS에 매번 보내지 않고 로컬에서 빠르게 암·복호화 · 마스터 키는 KMS 밖으로 안 나간다</text>
<text x="56" y="696" font-size="12" fill="#93A2B3">SecureNomad  ·  AWS SAA-C03</text>
</svg>