<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" font-family="Pretendard, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6BA3E6"/></marker></defs>
<rect width="1280" height="720" fill="#11161F"/>
<text x="56" y="62" font-size="31" font-weight="800" fill="#EAF0F7">권한의 상한 — 경계·SCP·Deny</text>
<text x="56" y="92" font-size="17" fill="#93A2B3">유효 권한 = 자격 증명 정책 ∩ 권한 경계 ∩ SCP, 그리고 명시적 Deny가 모든 것을 이긴다</text>
<rect x="70" y="232" width="250" height="150" rx="16" fill="#1B2432" stroke="#2B3747"/><image x="171.0" y="260.0" width="48" height="48" href="data:image/svg+xml;base64,"/><text x="195.0" y="344" font-size="19" fill="#EAF0F7" font-weight="700" text-anchor="middle">자격 증명 정책</text><text x="195.0" y="368" font-size="13" fill="#93A2B3" text-anchor="middle">무엇을 Allow 했나</text><text x="338" y="315" font-size="30" fill="#93A2B3" font-weight="700" text-anchor="middle">∩</text><rect x="360" y="232" width="250" height="150" rx="16" fill="#1B2432" stroke="#2B3747"/><text x="485.0" y="302" font-size="19" fill="#EAF0F7" font-weight="700" text-anchor="middle">권한 경계</text><text x="485.0" y="328" font-size="13" fill="#93A2B3" text-anchor="middle">가질 수 있는 상한</text><text x="628" y="315" font-size="30" fill="#93A2B3" font-weight="700" text-anchor="middle">∩</text><rect x="650" y="232" width="250" height="150" rx="16" fill="#1B2432" stroke="#2B3747"/><image x="751.0" y="260.0" width="48" height="48" href="data:image/svg+xml;base64,"/><text x="775.0" y="344" font-size="19" fill="#EAF0F7" font-weight="700" text-anchor="middle">SCP (조직)</text><text x="775.0" y="368" font-size="13" fill="#93A2B3" text-anchor="middle">계정 전체 상한</text><text x="918" y="315" font-size="30" fill="#6BA3E6" font-weight="700" text-anchor="middle">=</text><rect x="945" y="232" width="250" height="150" rx="16" fill="#212C3C" stroke="#6BA3E6"/><text x="1070.0" y="302" font-size="19" fill="#6BA3E6" font-weight="700" text-anchor="middle">유효 권한</text><text x="1070.0" y="328" font-size="13" fill="#93A2B3" text-anchor="middle">셋 다 허용해야</text><rect x="70" y="430" width="1120" height="52" rx="12" fill="#1B2432" stroke="#2B3747"/><text x="92" y="462" font-size="15" fill="#EAF0F7" text-anchor="start">셋 중 하나라도 Allow가 없거나 막으면 → 거부.  &#x27;권한을 줬는데 안 된다&#x27;의 범인은 대개 경계·SCP.</text><rect x="70" y="500" width="1120" height="52" rx="12" fill="#2a1620" stroke="#7a3b4a"/><text x="92" y="532" font-size="15" fill="#e68aa0" font-weight="700" text-anchor="start">그리고 어디든 &#x27;명시적 Deny&#x27;가 하나라도 있으면 → 위 교집합을 전부 무시하고 즉시 거부.</text><text x="70" y="600" font-size="13" fill="#93A2B3" text-anchor="start">리소스 기반 정책의 Allow는 별도 경로 — 교차 계정 접근은 &#x27;양쪽(자격증명+리소스)&#x27;이 모두 허용해야 한다.</text>
<text x="56" y="696" font-size="12" fill="#93A2B3">SecureNomad  ·  AWS SAA-C03</text>
</svg>