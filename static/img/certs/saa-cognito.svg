<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" font-family="Pretendard, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6BA3E6"/></marker></defs>
<rect width="1280" height="720" fill="#11161F"/>
<text x="56" y="62" font-size="31" font-weight="800" fill="#EAF0F7">Amazon Cognito — User Pool vs Identity Pool</text>
<text x="56" y="92" font-size="17" fill="#93A2B3">앱 사용자는 User Pool로 &#x27;인증&#x27;하고, Identity Pool로 임시 AWS 자격을 받아 리소스에 접근</text>
<image x="120.0" y="300.0" width="60" height="60" href="data:image/svg+xml;base64,"/><text x="150.0" y="381.0" text-anchor="middle" font-size="15" font-weight="700" fill="#EAF0F7">앱 사용자</text><line x1="205" y1="330" x2="300" y2="330" stroke="#F2A93D" stroke-width="2.4" marker-end="url(#ah)"/><rect x="310" y="250" width="290" height="180" rx="16" fill="#212C3C" stroke="#6BA3E6"/><image x="429.0" y="289.0" width="52" height="52" href="data:image/svg+xml;base64,"/><text x="455" y="388" font-size="17" fill="#6BA3E6" font-weight="700" text-anchor="middle">User Pool</text><text x="455" y="414" font-size="13" fill="#93A2B3" text-anchor="middle">누구인가 (인증 · 토큰)</text><line x1="600" y1="330" x2="700" y2="330" stroke="#F2A93D" stroke-width="2.4" marker-end="url(#ah)"/><text x="650" y="315" font-size="12" fill="#93A2B3" text-anchor="middle">토큰</text><rect x="710" y="250" width="290" height="180" rx="16" fill="#212C3C" stroke="#6BA3E6"/><image x="829.0" y="289.0" width="52" height="52" href="data:image/svg+xml;base64,"/><text x="855" y="388" font-size="17" fill="#6BA3E6" font-weight="700" text-anchor="middle">Identity Pool</text><text x="855" y="414" font-size="12" fill="#93A2B3" text-anchor="middle">무엇을 할 수 있나 (AWS 자격)</text><line x1="1000" y1="330" x2="1095" y2="330" stroke="#F2A93D" stroke-width="2.4" marker-end="url(#ah)"/><image x="1122.0" y="302.0" width="56" height="56" href="data:image/svg+xml;base64,"/><text x="1150.0" y="379.0" text-anchor="middle" font-size="15" font-weight="700" fill="#EAF0F7">AWS 리소스</text><rect x="310" y="470" width="690" height="56" rx="12" fill="#1B2432" stroke="#2B3747"/><text x="332" y="503" font-size="15" fill="#EAF0F7" text-anchor="start">User Pool = 로그인·회원관리(소셜·SAML 포함).  Identity Pool = STS 임시 AWS 자격 발급.</text><text x="310" y="566" font-size="14" fill="#93A2B3" text-anchor="start">둘은 자주 함께 쓰인다 — User Pool로 &#x27;인증&#x27;하고, 그 결과로 Identity Pool이 AWS &#x27;자격&#x27;을 내준다.</text>
<text x="56" y="696" font-size="12" fill="#93A2B3">SecureNomad  ·  AWS SAA-C03</text>
</svg>