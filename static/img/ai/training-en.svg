<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-label="Three training stages" font-family="Pretendard, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Three training stages</title>
<rect x="2" y="2" width="716" height="206" rx="14" fill="#161c28" stroke="#2b3747" stroke-width="1.5"/>
<rect x="26" y="60" width="188" height="96" rx="10" fill="#223049" stroke="#38516f" stroke-width="1.2"/>
<text x="120.0" y="96" fill="#6ba3e6" font-size="18" font-weight="700" text-anchor="middle">① Pre-training</text>
<text x="120.0" y="120" fill="#eaf0f7" font-size="13" font-weight="400" text-anchor="middle">learn world patterns</text>
<text x="120.0" y="140" fill="#eaf0f7" font-size="13" font-weight="400" text-anchor="middle">from vast text</text>
<line x1="214" y1="108" x2="258" y2="108" stroke="#6ba3e6" stroke-width="2"/><path d="M257,102 L257,114 L266,108 Z" fill="#6ba3e6"/>
<rect x="266" y="60" width="188" height="96" rx="10" fill="#223049" stroke="#38516f" stroke-width="1.2"/>
<text x="360.0" y="96" fill="#6ba3e6" font-size="18" font-weight="700" text-anchor="middle">② Fine-tuning</text>
<text x="360.0" y="120" fill="#eaf0f7" font-size="13" font-weight="400" text-anchor="middle">adjust to a form,</text>
<text x="360.0" y="140" fill="#eaf0f7" font-size="13" font-weight="400" text-anchor="middle">e.g. Q&A</text>
<line x1="454" y1="108" x2="498" y2="108" stroke="#6ba3e6" stroke-width="2"/><path d="M497,102 L497,114 L506,108 Z" fill="#6ba3e6"/>
<rect x="506" y="60" width="188" height="96" rx="10" fill="#223049" stroke="#38516f" stroke-width="1.2"/>
<text x="600.0" y="96" fill="#6ba3e6" font-size="18" font-weight="700" text-anchor="middle">③ RLHF</text>
<text x="600.0" y="120" fill="#eaf0f7" font-size="13" font-weight="400" text-anchor="middle">align to human</text>
<text x="600.0" y="140" fill="#eaf0f7" font-size="13" font-weight="400" text-anchor="middle">preferences</text>
<text x="26" y="36" fill="#93a2b3" font-size="16" font-weight="400" text-anchor="start">Three training stages</text>
</svg>