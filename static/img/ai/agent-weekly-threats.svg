<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" font-family="Pretendard, 'Noto Sans KR', sans-serif">
  <!-- column 1 : 수집 -->
  <rect x="8" y="30" width="300" height="52" rx="10" fill="#2e5b97"/>
  <text x="158" y="62" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">① 외부 뉴스 수집</text>

  <rect x="8" y="98" width="300" height="100" rx="10" fill="#b45a52"/>
  <text x="24" y="122" fill="#ffffff" font-size="13.5" font-weight="800">위협 · 프롬프트 인젝션</text>
  <text x="24" y="146" fill="#ffe3df" font-size="12">악성 페이지에 숨긴 지시가</text>
  <text x="24" y="166" fill="#ffe3df" font-size="12">에이전트의 도구 호출을 탈취</text>
  <text x="24" y="186" fill="#ffd0ca" font-size="11">(OWASP LLM01)</text>

  <rect x="8" y="214" width="300" height="104" rx="10" fill="#2f7d6e"/>
  <text x="24" y="238" fill="#ffffff" font-size="13.5" font-weight="800">통제</text>
  <text x="24" y="261" fill="#e4f3ee" font-size="12">· 외부 콘텐츠는 '데이터로만'</text>
  <text x="24" y="281" fill="#e4f3ee" font-size="12">· 승인된 소스만 수집(고정)</text>
  <text x="24" y="301" fill="#e4f3ee" font-size="12">· 실행 전 출력 검증</text>

  <!-- column 2 : 에이전트 -->
  <rect x="330" y="30" width="300" height="52" rx="10" fill="#2e5b97"/>
  <text x="480" y="56" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">② 에이전트</text>
  <text x="480" y="73" text-anchor="middle" fill="#cfe0f5" font-size="11">(토큰·권한을 쥐고 무인 실행)</text>

  <rect x="330" y="98" width="300" height="100" rx="10" fill="#b45a52"/>
  <text x="346" y="122" fill="#ffffff" font-size="13.5" font-weight="800">위협 · 블래스트 반경</text>
  <text x="346" y="146" fill="#ffe3df" font-size="12">서버/토큰이 뚫리면 git·배포</text>
  <text x="346" y="166" fill="#ffe3df" font-size="12">권한이 통째로 공격자에게</text>
  <text x="346" y="186" fill="#ffd0ca" font-size="11">(과도한 에이전시 · LLM08)</text>

  <rect x="330" y="214" width="300" height="104" rx="10" fill="#2f7d6e"/>
  <text x="346" y="238" fill="#ffffff" font-size="13.5" font-weight="800">통제</text>
  <text x="346" y="261" fill="#e4f3ee" font-size="12">· 스코프 디플로이 토큰</text>
  <text x="346" y="281" fill="#e4f3ee" font-size="12">· 도구 allow-list(최소 권한)</text>
  <text x="346" y="301" fill="#e4f3ee" font-size="12">· 시크릿 격리 · 샌드박스</text>

  <!-- column 3 : 커밋/배포 -->
  <rect x="652" y="30" width="300" height="52" rx="10" fill="#2e5b97"/>
  <text x="802" y="62" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">③ 커밋 → 배포</text>

  <rect x="652" y="98" width="300" height="100" rx="10" fill="#b45a52"/>
  <text x="668" y="122" fill="#ffffff" font-size="13.5" font-weight="800">위협 · 무검토 자동 발행</text>
  <text x="668" y="146" fill="#ffe3df" font-size="12">오보·환각이 라이브로 직행 →</text>
  <text x="668" y="166" fill="#ffe3df" font-size="12">공개 위키 평판 리스크</text>

  <rect x="652" y="214" width="300" height="104" rx="10" fill="#2f7d6e"/>
  <text x="668" y="238" fill="#ffffff" font-size="13.5" font-weight="800">통제</text>
  <text x="668" y="261" fill="#e4f3ee" font-size="12">· main 직접 push 금지</text>
  <text x="668" y="281" fill="#e4f3ee" font-size="12">· PR + 사람 승인 게이트</text>
  <text x="668" y="301" fill="#e4f3ee" font-size="12">· 빌드 검증(깨진 링크 차단)</text>

  <!-- bottom band : 감사 -->
  <rect x="8" y="334" width="944" height="50" rx="10" fill="#1f3f6b"/>
  <text x="480" y="364" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">전 구간 · 감사와 관측성 — 모든 도구 호출을 로깅하고, PR 기록으로 '무엇을 했는지' 재현 가능하게</text>
</svg>
