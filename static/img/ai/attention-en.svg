<text x="26" y="30" fill="#93a2b3" font-size="13" font-weight="400" text-anchor="start">Attention — weight important tokens in context</text>
<rect x="200" y="46" width="320" height="54" rx="10" fill="#2f74bb" stroke="#38516f" stroke-width="1.2"/>
<text x="360" y="79" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Next-token prediction</text>
